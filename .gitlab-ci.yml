# irlume's GitLab CI, running entirely on the project's archhost shell
# runner (tag: archhost; shared gitlab.com runners are disabled). This lane
# is deliberately independent of GitHub's action infrastructure; it exists
# because that infrastructure had a day it could not run anything.
#
# Stages fail fast in cost order: lint before the build, the build-and-test
# core before the audits, hardware-adjacent tests (real TPM, persistent
# v4l2loopback nodes) last. One runner executes one job at a time, so the
# stages also serialize the machine honestly.

workflow:
  rules:
    # One pipeline per change: MR pipelines for MRs, branch pipelines
    # otherwise, tag pipelines for tags. A branch with an open MR gets only
    # the MR pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  tags: [archhost]
  interruptible: true
  before_script:
    # The MSRV toolchain (1.88.0, the hosted gate's pin), NOT the runner's
    # rolling pacman rust: rolling clippy drifts new lints under -D warnings,
    # which failed the first pipeline here.
    - export PATH="$HOME/.cargo/bin:$PATH"
    - cargo --version

variables:
  # The shell executor cleans untracked files between jobs; the fetched
  # model weights are untracked and 266MB, so exempt them from the clean
  # instead of re-downloading every pipeline.
  GIT_CLEAN_FLAGS: -ffdx -e models/

stages:
  - lint
  - test
  - audit
  - hardware

lint:
  stage: lint
  timeout: 15 minutes
  script:
    - cargo fmt --all --check
    - cargo clippy --all-targets -- -D warnings
    - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

build-test:
  stage: test
  timeout: 40 minutes
  script:
    - bash scripts/fetch-models.sh
    - cargo build --release --locked
    # Guarded because `cargo test` exits 0 even when it discovers no tests
    # at all. The floor sits well below the real count (707 at 0.7.0).
    - ./scripts/run-tests-guarded.sh --min 650 -- cargo test --workspace --locked
    # The production TFLite mesh, end to end and ENFORCED: the test is
    # ignored by default (it needs the packaged runtime), so a rename or a
    # silent skip fails the --require guard instead of reading as green.
    - IRLUME_TFLITE_LIB=/usr/share/irlume/tflite/libtensorflowlite_c.so
      IRLUME_TFLITE_MESH_TEST_MODEL=models/face_landmarks_detector.tflite
      ./scripts/run-tests-guarded.sh --require pinned_landmarker_mesh_serves_landmarks_via_facemesh
      -- cargo test -p irlume-vision --locked -- --ignored pinned_landmarker_mesh_serves_landmarks_via_facemesh

audit:
  stage: audit
  timeout: 15 minutes
  script:
    - cargo-deny check
    - ./scripts/check-packaging-parity.sh
    - ./scripts/run-tests-guarded.sh --self-test
    - python3 scripts/verify-ppa-publish.py --self-test
    - for f in packaging/apparmor/*; do echo "parse $f"; apparmor_parser -QK "$f"; done

# The runner user is in the tss and video groups: the TPM tests hit the
# REAL TPM (device:/dev/tpmrm0), and the camera tests use the persistently
# provisioned v4l2loopback nodes (video8/9/10, group video via udev rule),
# the same setup the push-triggered GitHub preflight uses. The ffmpeg
# feeders live only for the job.
hardware:
  stage: hardware
  timeout: 30 minutes
  script:
    - bash scripts/fetch-models.sh
    - ./scripts/run-tests-guarded.sh --require seal_unseal_roundtrip_real_tpm,arm_and_unseal_roundtrip,reseal_only_when_stale,tpm_key_and_recovery_lifecycle,tpm_tampered_seal_falls_back_then_recovery_heals,seal_unseal_pcrlock_roundtrip_provisioned_nv
        -- cargo test -p irlume-core --lib --locked -- --ignored
        seal_unseal_roundtrip_real_tpm arm_and_unseal_roundtrip reseal_only_when_stale
        tpm_key_and_recovery_lifecycle tpm_tampered_seal_falls_back_then_recovery_heals seal_unseal_pcrlock_roundtrip_provisioned_nv
        --test-threads=1
    - ./scripts/run-tests-guarded.sh --min 1 -- cargo test -p irlume-daemon --locked -- --ignored tpm_ --test-threads=1
    - |
      if [ ! -w /dev/video8 ] || [ ! -w /dev/video9 ]; then
        echo "loopback nodes missing or not writable; re-provision v4l2loopback on the runner"
        exit 1
      fi
      ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x480:rate=30 -pix_fmt yuyv422 -f v4l2 /dev/video8 >/dev/null 2>&1 &
      ffmpeg -loglevel error -re -f lavfi -i testsrc2=size=640x400:rate=30 -pix_fmt gray -f v4l2 /dev/video9 >/dev/null 2>&1 &
      trap 'kill %1 %2 2>/dev/null || true' EXIT
      for _ in $(seq 1 15); do
        if [ -r /dev/video8 ] && [ -r /dev/video9 ]; then break; fi
        sleep 1
      done
      export IRLUME_TEST_RGB_DEVICE=/dev/video8 IRLUME_TEST_IR_DEVICE=/dev/video9 IRLUME_TEST_SPARE_DEVICE=/dev/video10 IRLUME_TEST_ALLOW_VIRTUAL_CAMERA=/dev/video8,/dev/video9
      ./scripts/run-tests-guarded.sh --min 15 -- cargo test -p irlume-camera -p irlume-auth -p irlume-daemon --locked -- --ignored loopback_ --test-threads=1
      ./scripts/run-tests-guarded.sh --min 7 -- cargo test -p irlume-cli --test cli_capture --locked -- --ignored loopback_ --test-threads=1
      ./scripts/run-tests-guarded.sh --min 5 -- cargo test -p irlume-cli --test cli_bench --locked -- --ignored bench_ --test-threads=1
      ./scripts/run-tests-guarded.sh --min 1 -- cargo test -p irlume-daemon --test shutdown --locked -- --ignored --test-threads=1
