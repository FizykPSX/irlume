# Mirror main and release tags to the GitLab standby
# (gitlab.com/archledger/irlume) whenever GitHub main moves. GitHub is the
# PRIMARY platform (issues, PRs, releases, community); the GitLab copy is a
# warm disaster-recovery lane with its own runner and pipeline, kept
# byte-identical by this job so a failover needs no preparation.
#
# Auth: a GitLab project access token (write_repository, Maintainer) stored
# as the GITLAB_MIRROR_TOKEN secret. Pushes are fast-forward by
# construction (GitLab never advances on its own in normal operation); a
# rejected push here means someone committed on the standby and a human
# must reconcile, so the job fails loudly rather than forcing.
name: Mirror to GitLab

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: [self-hosted, arch]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: push main and release tags to the standby
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          url="https://oauth2:${GITLAB_MIRROR_TOKEN}@gitlab.com/archledger/irlume.git"
          git push "$url" "refs/remotes/origin/main:refs/heads/main"
          git push "$url" --tags
